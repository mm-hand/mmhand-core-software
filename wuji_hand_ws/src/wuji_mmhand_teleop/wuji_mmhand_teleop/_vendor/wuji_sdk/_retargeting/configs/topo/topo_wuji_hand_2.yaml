# TopoOptimizer configuration for Wuji Hand 2.

optimizer:
  type: "TopoOptimizer"
  urdf_path: "../../wuji-description/hand2/body/urdf/{hand_side}.urdf"
  link_naming:
    prefix: "{hand_side[0]}_"
    palm: "wrist"
    fingers: [thumb, index_finger, middle_finger, ring_finger, pinky]
    link2: "{finger}_proximal"
    pip: "{finger}_middle"
    dip: "{finger}_distal"
    tip: "{finger}_tip"
    link1: "{finger}_proximal_abd"

retarget:
  lp_alpha: 0.2
  norm_delta: 0.04

  mediapipe_rotation_by_hand:
    left:
      x: 0.0
      y: 0.0
      z: -75.0
    right:
      x: 0.0
      y: 0.0
      z: -105.0

  topo:
    lambda_warm: 1.0
    lambda_lap: 150.0
    lambda_pose: 0.1
    lambda_smooth: 0.01
    first_frame_stage1_maxeval: 50
    later_frame_stage1_maxeval: 1
    first_frame_stage2_maxeval: 80
    later_frame_stage2_maxeval: 10
    nlopt_ftol_abs: 1.0e-4
    edge_eps: 1.0e-8
    topo_distance_scale: 50.0
    robot_keypoint_backoff_m: 0.005
    # Thumb-free hack layered on top of the base topo objective.
    thumb_free: true
    lambda_thumb_rel: 5.0
    thumb_rel_full_rad: 0.35
    thumb_rel_off_rad: 0.80
    thumb_rel_skip_proximal: 1
    lambda_antirev: 20.0

render:
  camera:
    azimuth: 135
    elevation: -20
    distance: 0.5
